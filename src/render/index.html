<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>振动编码工作台</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="top-bar" class="top-bar">
    <div class="top-bar-left">
      <span id="session-label" class="session-label"></span>
      <select id="session-nav" class="header-nav-select" aria-label="会话列表">
        <option value="">会话列表</option>
      </select>
      <a id="docs-link" class="header-nav-link" href="#" target="_blank" rel="noopener noreferrer" hidden>设计资产</a>
      <span id="diff-toggle-mount"></span>
    </div>
    <div class="top-bar-right">
      <span id="status-badge-mount"></span>
      <button id="submit-btn" class="submit-btn" type="button">提交</button>
    </div>
  </header>

  <main id="main-content" class="main-content">
    <div id="zones-mount"></div>

    <!-- 会话级常驻留言（iteration-brief P1）：不针对任何块的自由发言通道。
         病例 6：用户被迫把给工作台的产品反馈挂在不相干块的批注里。 -->
    <section id="session-comment" class="session-comment">
      <h3 class="session-comment-h">💬 给 AI 留言（不针对任何具体块）</h3>
      <p class="session-comment-hint">对整体的看法、对工作台本身的意见、或任何没地方说的话，写这里——会随本轮反馈一起回传。</p>
      <textarea id="session-comment-input" class="session-comment-input" rows="3"
        placeholder="例如：背景讲清楚了，但第 3 个决策我还是不懂 X 是什么；另外工作台能不能……"></textarea>
    </section>
  </main>

  <!-- 提交前确认模态（§13 P0-1）：内容由 app.mjs 注入 -->
  <dialog id="confirm-dialog" class="confirm-dialog"></dialog>

  <!-- 本地 mermaid（缺失则降级静默） -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'vendor/mermaid.min.js';
      s.onload = function () {
        if (window.mermaid) {
          window.mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
        }
      };
      s.onerror = function () { /* 降级：mermaid 不可用，静默 */ };
      document.head.appendChild(s);
    })();
  </script>

  <script type="module" src="app.mjs"></script>
</body>
</html>
