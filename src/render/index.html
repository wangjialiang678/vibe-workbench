<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>__WB_TITLE__</title>
  <script>window.__WB_TITLE = document.title.indexOf('__') === 0 ? 'Vibe Coding工作台' : document.title;
    if (document.title.indexOf('__') === 0) document.title = window.__WB_TITLE;</script>
  <!-- 资产版本注入（DESIGN §6.7）：服务端把 __WB_ASSETS_V__ 替换为当前资产版本。
       HTML 本身 no-store 永远新鲜，资源全部带 ?v= 加载——从 URL 层面绕开任何历史缓存
       （headerless 时代的启发式缓存条目对新 URL 永不命中）。直接开文件未经服务端时回退 Date.now()。-->
  <script>window.__WB_ASSETS_V = '__WB_ASSETS_V__';
    if (window.__WB_ASSETS_V.indexOf('__') === 0) window.__WB_ASSETS_V = String(Date.now());</script>
  <!--__WB_IMPORTMAP__-->
  <!-- theme.css 装的是全部视觉旋钮（颜色/字号/行高/间距/版心）；app.css 只做布局与组件。
       调外观改 theme.css 即可，不用进 app.css。 -->
  <link rel="stylesheet" href="theme.css?v=__WB_ASSETS_V__">
  <link rel="stylesheet" href="app.css?v=__WB_ASSETS_V__">
</head>
<body>
  <header id="top-bar" class="top-bar">
    <div class="top-bar-left">
      <span id="session-label" class="session-label"></span>
      <select id="session-nav" class="header-nav-select" aria-label="项目与会话列表">
        <option value="">项目首页</option>
      </select>
      <a id="docs-link" class="header-nav-link" href="#" target="_blank" rel="noopener noreferrer" hidden>设计资产</a>
      <span id="diff-toggle-mount"></span>
    </div>
    <div class="top-bar-right">
      <div id="self-report-control" class="self-report-control" hidden>
        <span class="self-report-dot" aria-hidden="true"></span>
        <span class="self-report-prompt">请选择提交人</span>
        <button id="self-report-summary" class="self-report-summary" type="button" hidden></button>
        <div class="self-report-editor">
          <select id="self-report-select" aria-label="选择提交人">
            <option value="">请选择</option>
          </select>
          <input id="self-report-other" type="text" maxlength="40" placeholder="输入姓名" aria-label="输入提交人姓名" hidden>
        </div>
      </div>
      <span id="status-badge-mount"></span>
      <button id="submit-btn" class="submit-btn" type="button">提交</button>
    </div>
  </header>

  <main id="workspace-shell" class="workspace-shell" data-active-view="decision">
    <!-- 收起态的竖条：默认就是它。点一下展开对话栏；有未读消息时冒红点。 -->
    <button id="stream-rail" class="stream-rail" type="button"
      aria-expanded="false" aria-controls="stream-panel" aria-label="展开对话" title="展开对话">
      <span id="stream-rail-dot" class="stream-rail-dot" hidden aria-hidden="true"></span>
      <span class="stream-rail-label">对话</span>
    </button>

    <aside id="stream-panel" class="stream-panel" aria-label="对话">
      <div class="stream-panel-head">
        <div>
          <p class="stream-panel-kicker">CONVERSATION</p>
          <h2>对话</h2>
        </div>
        <div class="stream-panel-head-right">
          <span id="stream-connection" class="stream-connection" aria-live="polite">连接中</span>
          <button id="stream-collapse" class="stream-collapse" type="button"
            aria-label="收起对话" title="收起对话">&#x27E8;</button>
        </div>
      </div>
      <p id="stream-migration-hint" class="stream-migration-hint" hidden>历史留言可由管理员迁移进来</p>
      <div id="stream-entries" class="stream-entries" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form id="stream-composer" class="stream-composer">
        <label class="stream-composer-label" for="stream-input">发消息</label>
        <textarea id="stream-input" class="stream-input" rows="1" maxlength="4000"
          placeholder="输入消息，或粘贴截图…"></textarea>
        <div class="stream-composer-actions">
          <label class="stream-attach" title="上传图片或 PDF">
            <input id="stream-file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,.xlsx,.xls,.docx,.csv" multiple>
            <span aria-hidden="true">＋</span><span>附件</span>
          </label>
          <span id="stream-send-status" class="stream-send-status" aria-live="polite"></span>
          <button id="stream-self-report-prompt" class="stream-self-report-prompt" type="button" hidden>
            <span aria-hidden="true"></span>请选择提交人
          </button>
          <button id="stream-send-btn" class="stream-send-btn" type="submit">发送</button>
        </div>
      </form>
    </aside>

    <div id="workspace-splitter" class="workspace-splitter" role="separator"
      aria-label="调整对话宽度" aria-orientation="vertical" tabindex="0"></div>

    <section id="content-region" class="content-region">
      <nav class="content-switch" aria-label="内容区">
        <button class="content-switch-btn is-active" type="button" data-view="decision" aria-selected="true">决策</button>
        <button class="content-switch-btn" type="button" data-view="documents" aria-selected="false">文档</button>
      </nav>

      <section id="decision-panel" class="content-panel decision-panel" data-content-view="decision">
        <div id="zones-mount"></div>

        <!-- 会话级常驻留言保留在决策区，提交协议与历史行为不变。 -->
        <section id="session-comment" class="session-comment">
          <h3 class="session-comment-h">💬 给 AI 留言（不针对任何具体块）</h3>
          <p class="session-comment-hint">对整体的看法、对工作台本身的意见、或任何没地方说的话，写这里——会随本轮反馈一起回传。</p>
          <textarea id="session-comment-input" class="session-comment-input" rows="3"
            placeholder="例如：背景讲清楚了，但第 3 个决策我还是不懂 X 是什么；另外工作台能不能……"></textarea>
        </section>

        <!-- 历史轮次是决策过程归档，不再与最新文档混放。 -->
        <details class="history-rounds">
          <summary>历史轮次</summary>
          <div id="history-rounds-mount"></div>
        </details>
      </section>

      <section id="documents-panel" class="content-panel documents-panel" data-content-view="documents" hidden>
        <div id="documents-mount" class="documents-mount"></div>
      </section>
    </section>
  </main>

  <nav class="mobile-tabs" aria-label="手机页面分区">
    <button class="mobile-tab" type="button" data-view="stream">
      <span>对话</span><span id="stream-unread-badge" class="mobile-tab-badge" hidden>0</span>
    </button>
    <button class="mobile-tab is-active" type="button" data-view="decision">
      <span>决策</span><span id="decision-unread-badge" class="mobile-tab-badge" hidden>0</span>
    </button>
    <button class="mobile-tab" type="button" data-view="documents"><span>文档</span></button>
  </nav>

  <!-- 提交前确认模态（§13 P0-1）：内容由 app.mjs 注入 -->
  <dialog id="confirm-dialog" class="confirm-dialog"></dialog>

  <!-- 本地 mermaid（缺失则降级静默） -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'vendor/mermaid.min.js?v=' + window.__WB_ASSETS_V;
      s.onload = function () {
        if (window.mermaid) {
          window.mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
          // 补渲染：内容常常先于本脚本就绪（竞态），app.mjs 会置 __wantMermaid 标记
          if (window.__renderMermaidDiagrams) window.__renderMermaidDiagrams();
        }
      };
      s.onerror = function () { /* 降级：mermaid 不可用，静默 */ };
      document.head.appendChild(s);
    })();
  </script>

  <script type="module">import('./app.mjs?v=' + window.__WB_ASSETS_V);</script>
</body>
</html>
